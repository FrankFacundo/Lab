[project]
name = "tts-meta-eval"
version = "0.1.0"
description = "Meta-evaluation of TTS evaluation methods: synthesize the same test items with several models and score them with many metrics (WER x2 ASR engines, speaker similarity, UTMOS)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchaudio",
    "transformers>=4.56,<5",
    "datasets>=3.0",
    "soundfile",
    "torchcodec",
    "librosa",
    "jiwer>=3.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "tabulate",
    "regex",
    "huggingface_hub",
    "tqdm",
    "gdown",
    # torchmetrics-style pkg_resources users still exist in the audio stack
    "setuptools<81",
]

[project.scripts]
ttseval = "tts_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_eval"]
